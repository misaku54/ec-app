
services:
  postgresdb:
    image: postgres:16
    restart: unless-stopped
    env_file: ./.env
    ports:
      - "5433:5432"
    volumes:
      - db-storage:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # バックエンド。DB と MinIO はコンテナ名で解決するため、接続先を環境変数で上書きする。
  # （application-local.* は IntelliJ / ホスト起動用で localhost を向いているため使わない）
  app:
    build: ./app
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      - SERVER_PORT=8888
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgresdb:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - AWS_ENDPOINT=http://minio:9000
      - AWS_MINIO_USER=${MINIO_ROOT_USER}
      - AWS_MINIO_PASS=${MINIO_ROOT_PASSWORD}
    volumes:
      - maven-repo:/root/.m2
    depends_on:
      postgresdb:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    ports:
      - "3003:5173"
    volumes:
      - ./frontend:/frontend
      - /frontend/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    stdin_open: true
    tty: true

  localstack:
    image: localstack/localstack:3.0
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - DEBUG=1
    volumes:
      - localstack-data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock

  minio:
    # MinIO は公式イメージの配布先が Docker Hub から quay.io へ移行済み。
    # docker.io/minio/minio は pull できないため quay.io を指定する。
    image: quay.io/minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file: ./.env
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 商品画像用バケットを作成する初期化コンテナ。
  # バケット名は application.yml の aws.s3.bucket-name と揃える。
  # フロントは http://localhost:9000/your-bucket/<key> を直接参照するため匿名 GET を許可する。
  createbuckets:
    image: quay.io/minio/mc:latest
    env_file: ./.env
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/your-bucket &&
      mc anonymous set download local/your-bucket
      "

volumes:
  db-storage:
  localstack-data:
  minio-data:
  maven-repo:
