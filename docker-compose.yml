
services:
  postgresdb:
    image: postgres:16
    restart: unless-stopped
    env_file: ./.env
    ports:
      - "5433:5432"
    volumes:
      - db-storage:/var/lib/postgresql/data

  frontend:
    build: ./frontend
    ports:
      - "3003:5173"
    volumes:
      - ./frontend:/frontend
      - /frontend/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    stdin_open: true
    tty: true

  localstack:
    image: localstack/localstack:3.0
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - DEBUG=1
    volumes:
      - localstack-data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock

  minio:
    # MinIO は公式イメージの配布先が Docker Hub から quay.io へ移行済み。
    # docker.io/minio/minio は pull できないため quay.io を指定する。
    image: quay.io/minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file: ./.env
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"

volumes:
  db-storage:
  localstack-data:
  minio-data:
