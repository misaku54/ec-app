
services:
  postgresdb:
    image: postgres:16
    restart: unless-stopped
    env_file: ./.env
    ports:
      - "5433:5432"
    volumes:
      - db-storage:/var/lib/postgresql/data

  app:
    build: ./app
    depends_on:
      - postgresdb
    env_file: ./.env
    ports:
      - "8888:8080"
    volumes:
      - ./app:/app
    command: ./mvnw spring-boot:run
    stdin_open: true
    tty: true

  frontend:
    build: ./frontend
    ports:
      - "3003:5173"
    volumes:
      - ./frontend:/frontend
      - /frontend/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    stdin_open: true
    tty: true

  localstack:
    image: localstack/localstack:3.0
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - DEBUG=1
    volumes:
      - localstack-data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"

volumes:
  db-storage:
  localstack-data:
  minio-data:
